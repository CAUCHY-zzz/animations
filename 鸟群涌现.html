<dialog id="about"><h2>队形从局部互动中形成</h2><p>没有领头鸟，也没有预设的队形或飞行路线。每只鸟只响应感知范围内最近的最多 7 只邻居：</p><p>避碰：与太近的邻居保持距离。<br>对齐：逐渐接近邻居的平均飞行方向。<br>聚拢：向邻居所在的局部位置靠近。</p><p>每只鸟还带有独立的微小随机扰动，并避开场地边界。开启隼时，只有靠近隼的鸟直接躲避，其余变化通过邻居互动传播。</p><small>仿真逐步演化，可以持续运行；暂停会保留当前状态。更改鸟数或点击“重新开始”会生成新的初始状态。</small><p><button id="close">继续观察</button></p></dialog>

    this.noiseZ[i]=this.noiseZ[i]*.94+(this.rand()*2-1)*.35;

  }
  metrics(){let vx=0,vy=0,vz=0,speed=0,neighbors=0,q=0;
   for(let i=0;i<this.n;i++){vx+=this.vx[i];vy+=this.vy[i];vz+=this.vz[i];speed+=Math.hypot(this.vx[i],this.vy[i],this.vz[i]);neighbors+=this.neighborCount[i];q=Math.max(q,this.x[i]**2/850**2+this.y[i]**2/310**2+this.z[i]**2/430**2);}

 ctx.textAlign='center';ctx.fillStyle='#dedfdc';ctx.font='31px SimSun,serif';ctx.fillText('鸟 群 涌 现',960,88);ctx.fillStyle='#9e946f';ctx.font='9px Georgia,serif';ctx.fillText('L O C A L   R U L E S   ·   E M E R G E N T   F L O C K I N G',960,117);ctx.fillStyle='#949fa9';ctx.font='17px SimSun,serif';ctx.fillText('每只鸟只响应附近最多 7 只邻居',960,978);ctx.fillStyle='#586b7c';ctx.font='11px Georgia,serif';ctx.fillText('Separation · Alignment · Cohesion',960,1004);ctx.textAlign='left';

function togglePlay(){playing=!playing;byId('play').textContent=playing?'暂停':'继续';byId('play').setAttribute('aria-pressed',String(!playing));accumulator=0;showPanel();}
function showPanel(){panel.classList.remove('hide');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!panel.matches(':hover')&&!panel.contains(document.activeElement))panel.classList.add('hide');},5000);}
byId('play').onclick=togglePlay;byId('reset').onclick=restart;byId('count').onchange=restart;for(const id of ['separation','alignment','cohesion'])byId(id).oninput=applyParams;
byId('predator').onchange=e=>sim.setPredator(e.target.checked);byId('neighbors').onchange=e=>{showNeighbors=e.target.checked;if(showNeighbors)chooseBird();byId('hint').textContent=showNeighbors?'点击选择一只鸟，显示它当前响应的邻居':'点击画面投放局部扰动 · 空格暂停 · H 显示控制';};
byId('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{byId('hint').textContent='当前浏览器未允许全屏，可使用 F11。';}};
byId('rules').onclick=()=>byId('about').showModal();byId('close').onclick=()=>byId('about').close();byId('reveal').onclick=showPanel;
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1920,y=(e.clientY-r.top)/r.height*1080;if(showNeighbors)chooseBird(x,y);else sim.disturb((x-960)/.987,y-540,0);});
document.addEventListener('pointermove',showPanel);document.addEventListener('keydown',e=>{if(e.target.matches('input,select,button')||byId('about').open)return;if(e.code==='Space'){e.preventDefault();togglePlay();}if(e.code==='KeyH')showPanel();});document.addEventListener('visibilitychange',()=>{last=null;accumulator=0;});window.addEventListener('resize',resize);
// Read-only access to diagnostics and explicit manual stepping, useful for review.
window.flockDemo={get simulation(){return sim;},get playing(){return playing;},metrics:()=>sim.metrics(),step(count=1){for(let i=0;i<count;i++)sim.step(dt);draw();},draw};
resize();showPanel();requestAnimationFrame(tick);
</script></body></html>
