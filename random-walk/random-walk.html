<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>随机游走</title>
<style>
:root{color-scheme:dark;--accent:#59e1d2}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#0b1422;color:#eff6ff;font-family:system-ui,"Microsoft YaHei",sans-serif}body[data-mode="3"]{--accent:#b9a0ff}canvas{position:fixed;inset:0;display:block;width:100%;height:100%;height:100dvh;touch-action:none;outline:none}body[data-mode="3"] canvas{cursor:grab}body[data-mode="3"] canvas:active{cursor:grabbing}.controls{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:1;width:290px;max-width:calc(100vw - 24px);padding:18px;border:1px solid #52698550;border-radius:16px;background:#111e30de;backdrop-filter:blur(14px);box-shadow:0 12px 45px #0005}.stats{display:grid;gap:12px;margin-bottom:17px}.stat{display:flex;align-items:baseline;justify-content:space-between;gap:14px}.label{color:#93a7bd;font-size:12px;white-space:nowrap}.value{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere;min-width:0}.steps{font-size:25px;font-weight:600;line-height:1.2}.position{font-size:14px;font-family:ui-monospace,Consolas,monospace;line-height:1.5}.speed-row{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#93a7bd;font-size:12px}.speed-row output{color:#dce6f2;white-space:nowrap;font-variant-numeric:tabular-nums}input[type="range"]{display:block;width:100%;margin:10px 0 17px;accent-color:var(--accent);cursor:pointer}.precision-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;color:#93a7bd;font-size:12px}.precision-row select{min-width:128px;max-width:58%;font:inherit;color:#dce6f2;background:#182b41;border:1px solid #344962;border-radius:7px;padding:7px 9px;cursor:pointer}select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.buttons{display:flex;gap:8px}button{font:inherit;border:1px solid #344962;background:#182b41;color:#ecf4ff;border-radius:9px;height:39px;cursor:pointer}button:hover{background:#243b55}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.switch{flex:1;font-size:13px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}.zoom{width:39px;flex:none;font-size:23px;line-height:1}@media(max-width:480px){.controls{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:258px;padding:15px}.steps{font-size:22px}}@media(max-height:400px){.controls{padding:12px}.stats{gap:7px;margin-bottom:10px}input[type="range"]{margin:5px 0 10px}}
</style></head><body data-mode="2">
<canvas id="canvas" tabindex="0" role="img" aria-label="二维随机游走动画，滚轮或双指缩放"></canvas>
<aside class="controls" aria-label="随机游走控制面板"><div class="stats"><div class="stat"><span class="label">累计步数</span><span class="value steps" id="steps">0</span></div><div class="stat"><span class="label">位置</span><span class="value position" id="position">(0, 0)</span></div></div><div class="speed-row"><label for="speed">速度</label><output for="speed" id="speedValue">12 步/秒</output></div><input id="speed" aria-label="游走速度，步每秒" type="range" min="1" max="60" value="12"><div class="precision-row"><label for="precision">坐标系精度</label><select id="precision" aria-label="坐标系精度，每格的坐标单位"><option value="auto" selected>自动</option><option value="0.1">0.1 单位/格</option><option value="0.5">0.5 单位/格</option><option value="1">1 单位/格</option><option value="2">2 单位/格</option><option value="5">5 单位/格</option><option value="10">10 单位/格</option><option value="20">20 单位/格</option><option value="50">50 单位/格</option><option value="100">100 单位/格</option></select></div><div class="buttons"><button class="switch" id="switch" aria-label="当前为二维，切换到三维随机游走">切换到三维</button><button class="zoom" id="zoomOut" aria-label="缩小" title="缩小">−</button><button class="zoom" id="zoomIn" aria-label="放大" title="放大">+</button></div></aside>
<script>
'use strict';
const $=id=>document.getElementById(id),CAPACITY=10001;
const DIRECTIONS=[[1,0,0,'+x →'],[-1,0,0,'−x ←'],[0,1,0,'+y ↑'],[0,-1,0,'−y ↓'],[0,0,1,'+z'],[0,0,-1,'−z']];
const numberFormat=new Intl.NumberFormat('zh-CN');
class Walker{
 constructor(dim){this.dim=dim;this.canvas=$('canvas');this.ctx=this.canvas.getContext('2d');this.data=new Float64Array(CAPACITY*3);this.reset();}
 reset(){this.head=0;this.length=1;this.steps=0;this.x=this.y=this.z=0;this.previous=[0,0,0];this.data.fill(0);this.direction='—';this.segmentStart=0;this.segmentDuration=0;this.range=12;this.viewRange=12;}
 point(i){const at=((this.head+i)%CAPACITY)*3;return[this.data[at],this.data[at+1],this.data[at+2]];}
 step(now,duration){const d=DIRECTIONS[Math.floor(Math.random()*(this.dim===2?4:6))];this.previous=[this.x,this.y,this.z];this.x+=d[0];this.y+=d[1];this.z+=d[2];this.steps++;this.direction=d[3];const at=((this.head+this.length)%CAPACITY)*3;this.data[at]=this.x;this.data[at+1]=this.y;this.data[at+2]=this.z;if(this.length<CAPACITY)this.length++;else this.head=(this.head+1)%CAPACITY;this.segmentStart=now;this.segmentDuration=duration;this.range=Math.max(this.range,Math.hypot(this.x,this.y,this.z)+4);if(this.steps%200===0)this.recalculateRange();}
 recalculateRange(){let r=12;for(let i=0;i<this.length;i++){const at=((this.head+i)%CAPACITY)*3;r=Math.max(r,Math.hypot(this.data[at],this.data[at+1],this.data[at+2])+4);}this.range=r;}
 updateUI(){if(this.dim!==mode)return;$('steps').textContent=numberFormat.format(this.steps);$('position').textContent=this.dim===2?`(${this.x}, ${this.y})`:`(${this.x}, ${this.y}, ${this.z})`;}
 fit(){const r=this.canvas.getBoundingClientRect();this.w=r.width;this.h=r.height;const ratio=Math.min(devicePixelRatio||1,2);this.canvas.width=Math.round(r.width*ratio);this.canvas.height=Math.round(r.height*ratio);this.ctx.setTransform(ratio,0,0,ratio,0,0);}
}
const walkers=[new Walker(2),new Walker(3)];
let mode=2,yaw=.68,pitch=.45,zoom={2:1,3:1},renderLast=0;
const pointers=new Map();let pinchDistance=0;
let gridPrecision=0;
let speed=12,simulationLast=performance.now(),pending=0,stopped=false,timer=0,raf=0;
function simulate(){if(stopped)return;const now=performance.now(),interval=1000/speed;pending+=Math.max(0,now-simulationLast)*speed/1000;simulationLast=now;const count=Math.min(Math.floor(pending+1e-9),2000);pending=Math.max(0,pending-count);for(let i=0;i<count;i++){const stamp=now-(count-1-i)*interval;walkers[mode-2].step(stamp,interval);}if(count)walkers[mode-2].updateUI();timer=setTimeout(simulate,pending>=1?0:Math.max(4,(1-pending)*interval));}
function niceTick(range){const raw=range/5,base=10**Math.floor(Math.log10(raw)),n=raw/base;return(n<=1?1:n<=2?2:n<=5?5:10)*base;}
function project(point,walker){const s=Math.min(walker.w,walker.h)*.42/walker.viewRange*zoom[walker.dim];if(walker.dim===2)return[walker.w/2+point[0]*s,walker.h/2-point[1]*s,0];const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),horizontal=cy*point[0]-sy*point[2],depth=sy*point[0]+cy*point[2];return[walker.w/2+horizontal*s,walker.h/2-(cp*point[1]-sp*depth)*s,sp*point[1]+cp*depth];}
function line(ctx,a,b){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}

const coordinateFormat=new Intl.NumberFormat('zh-CN',{maximumFractionDigits:6,useGrouping:false});
function gridMetrics(walker){const scale=Math.min(walker.w,walker.h)*.42/walker.viewRange*zoom[walker.dim],requested=gridPrecision||niceTick(walker.viewRange/zoom[walker.dim]);
 // Subpixel divisions are skipped; labeled major ticks stay on exact grid multiples.
 const stride=Math.max(1,Math.ceil(2/(scale*requested))),tick=requested*stride,labelEvery=Math.max(1,Math.ceil(60/(scale*tick)));return{scale,requested,tick,labelEvery};}
function grid2(walker){const ctx=walker.ctx,{scale:s,tick,labelEvery}=gridMetrics(walker),ox=walker.w/2,oy=walker.h/2;
 ctx.lineWidth=1;ctx.strokeStyle='#1c2d40';ctx.beginPath();const nx=Math.ceil(walker.w/(2*s*tick)),ny=Math.ceil(walker.h/(2*s*tick));
 for(let i=-nx;i<=nx;i++)line(ctx,[ox+i*tick*s,0],[ox+i*tick*s,walker.h]);for(let i=-ny;i<=ny;i++)line(ctx,[0,oy-i*tick*s],[walker.w,oy-i*tick*s]);ctx.stroke();
 ctx.strokeStyle='#39516a';ctx.beginPath();line(ctx,[0,oy],[walker.w,oy]);line(ctx,[ox,0],[ox,walker.h]);ctx.stroke();ctx.font='10px system-ui';ctx.fillStyle='#819bb3';ctx.fillText('+x',walker.w-25,oy-10);ctx.fillText('+y',ox+8,15);
 for(let i=-nx;i<=nx;i++){if(i&&i%labelEvery===0&&ox+i*tick*s>20&&ox+i*tick*s<walker.w-25)ctx.fillText(coordinateFormat.format(i*tick),ox+i*tick*s-6,oy+15);}for(let i=-ny;i<=ny;i++){if(i&&i%labelEvery===0&&oy-i*tick*s>25&&oy-i*tick*s<walker.h-15)ctx.fillText(coordinateFormat.format(i*tick),ox+6,oy-i*tick*s+3);}}
function grid3(walker){const ctx=walker.ctx,r=walker.viewRange*.85,{tick,labelEvery}=gridMetrics(walker),n=Math.floor(r/tick);ctx.lineWidth=1;ctx.strokeStyle='#233044';ctx.beginPath();
 for(let i=-n;i<=n;i++){const v=i*tick;line(ctx,project([v,0,-r],walker),project([v,0,r],walker));line(ctx,project([-r,0,v],walker),project([r,0,v],walker));}ctx.stroke();
 const colors=['#59e1d2','#83b8ff','#b9a0ff'];ctx.font='11px system-ui';for(let axis=0;axis<3;axis++){const a=[0,0,0],b=[0,0,0];a[axis]=-r;b[axis]=r;const pa=project(a,walker),pb=project(b,walker);ctx.strokeStyle=colors[axis];ctx.globalAlpha=.65;ctx.beginPath();line(ctx,pa,pb);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=colors[axis];ctx.fillText('+'+'xyz'[axis],pb[0]+5,pb[1]-5);ctx.fillText('−'+'xyz'[axis],pa[0]+5,pa[1]-5);
  ctx.beginPath();for(let i=-n;i<=n;i++){if(i===0||i%labelEvery!==0)continue;const p=[0,0,0];p[axis]=i*tick;const q=project(p,walker);line(ctx,[q[0]-2,q[1]-2],[q[0]+2,q[1]+2]);ctx.fillText(coordinateFormat.format(i*tick),q[0]+5,q[1]+12);}ctx.stroke();}}
function draw(walker,now,dt){if(!walker.w||!walker.h)return;const ctx=walker.ctx;walker.viewRange+=(walker.range-walker.viewRange)*(1-Math.exp(-dt/180));ctx.clearRect(0,0,walker.w,walker.h);if(walker.dim===2)grid2(walker);else grid3(walker);const t=walker.segmentDuration?Math.min(1,Math.max(0,(now-walker.segmentStart)/walker.segmentDuration)):1,current=[walker.previous[0]+(walker.x-walker.previous[0])*t,walker.previous[1]+(walker.y-walker.previous[1])*t,walker.previous[2]+(walker.z-walker.previous[2])*t],color=walker.dim===2?'#59e1d2':'#b9a0ff';ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=1.8;ctx.strokeStyle=color;const segments=walker.length-1;for(let group=0;group<3;group++){const start=Math.floor(segments*group/3),end=Math.floor(segments*(group+1)/3);if(start===end)continue;ctx.globalAlpha=[.2,.4,.75][group];ctx.beginPath();const a=project(walker.point(start),walker);ctx.moveTo(a[0],a[1]);for(let i=start+1;i<=end;i++){const p=project(i===segments?current:walker.point(i),walker);ctx.lineTo(p[0],p[1]);}ctx.stroke();}ctx.globalAlpha=1;const origin=project([0,0,0],walker);ctx.fillStyle='#ffbc78';ctx.beginPath();ctx.arc(origin[0],origin[1],4,0,Math.PI*2);ctx.fill();const p=project(current,walker);ctx.fillStyle=walker.dim===2?'#59e1d220':'#b9a0ff20';ctx.beginPath();ctx.arc(p[0],p[1],13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=14;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0],p[1],5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=1.3;ctx.strokeStyle='#f1fffd';ctx.stroke();}

function frame(now){if(stopped)return;const dt=renderLast?Math.min(100,Math.max(0,now-renderLast)):16;renderLast=now;draw(walkers[mode-2],now,dt);raf=requestAnimationFrame(frame);}
function zoomBy(delta){zoom[mode]=Math.max(.15,Math.min(12,zoom[mode]*Math.exp(delta)));}
function switchMode(){clearTimeout(timer);mode=mode===2?3:2;walkers[mode-2].reset();pending=0;simulationLast=performance.now();renderLast=0;pointers.clear();pinchDistance=0;document.body.dataset.mode=mode;$('switch').textContent=mode===2?'切换到三维':'切换到二维';$('switch').setAttribute('aria-label',mode===2?'当前为二维，切换到三维随机游走':'当前为三维，切换到二维随机游走');canvas.setAttribute('aria-label',mode===2?'二维随机游走动画，滚轮或双指缩放':'三维随机游走动画，拖动旋转，滚轮或双指缩放');walkers[mode-2].updateUI();draw(walkers[mode-2],simulationLast,16);simulate();}
const canvas=$('canvas');
$('precision').onchange=()=>{const choice=$('precision').value;gridPrecision=choice==='auto'?0:Number(choice);if(!Number.isFinite(gridPrecision)||gridPrecision<0.1&&gridPrecision!==0)gridPrecision=0;};
$('switch').onclick=switchMode;$('zoomIn').onclick=()=>zoomBy(.22);$('zoomOut').onclick=()=>zoomBy(-.22);
$('speed').oninput=()=>{const now=performance.now();pending+=Math.max(0,now-simulationLast)*speed/1000;simulationLast=now;speed=Number($('speed').value);$('speedValue').textContent=speed+' 步/秒';clearTimeout(timer);simulate();};
function pointerDistance(){const pair=[...pointers.values()];return pair.length===2?Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y):0;}
canvas.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button!==0)return;canvas.focus({preventScroll:true});pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});canvas.setPointerCapture(event.pointerId);pinchDistance=pointerDistance();});
canvas.addEventListener('pointermove',event=>{const previous=pointers.get(event.pointerId);if(!previous)return;const dx=event.clientX-previous.x,dy=event.clientY-previous.y;pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});if(pointers.size===2){const distance=pointerDistance();if(distance>0&&pinchDistance>0)zoomBy(Math.log(distance/pinchDistance));pinchDistance=distance;}else if(pointers.size===1&&mode===3){yaw+=dx*.008;pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*.008));}});
function endPointer(event){pointers.delete(event.pointerId);pinchDistance=pointerDistance();}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('lostpointercapture',endPointer);
canvas.addEventListener('wheel',event=>{event.preventDefault();const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1);zoomBy(Math.max(-.7,Math.min(.7,-delta*.001)));},{passive:false});
canvas.addEventListener('keydown',event=>{const actions={'+':()=>zoomBy(.15),'=':()=>zoomBy(.15),'-':()=>zoomBy(-.15),Home:()=>{zoom[mode]=1;if(mode===3){yaw=.68;pitch=.45;}}};if(mode===3)Object.assign(actions,{ArrowLeft:()=>yaw-=.12,ArrowRight:()=>yaw+=.12,ArrowUp:()=>pitch=Math.min(1.3,pitch+.12),ArrowDown:()=>pitch=Math.max(-1.3,pitch-.12)});if(actions[event.key]){event.preventDefault();actions[event.key]();}});
const observer=new ResizeObserver(()=>{for(const walker of walkers)walker.fit();});observer.observe(canvas);for(const walker of walkers){walker.fit();walker.updateUI();}
document.addEventListener('visibilitychange',()=>{renderLast=0;clearTimeout(timer);simulate();});
addEventListener('pagehide',()=>{stopped=true;clearTimeout(timer);cancelAnimationFrame(raf);});addEventListener('pageshow',()=>{if(stopped){stopped=false;simulationLast=performance.now();renderLast=0;simulate();raf=requestAnimationFrame(frame);}});
simulate();raf=requestAnimationFrame(frame);
</script></body></html>
